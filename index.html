<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      Demo Practice, of HTML Forms and How To Collection on W3School
    </title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- #region Login Form/Transofored To Hypothetical Survey -->
    <!--  Original Snippet(s): https://www.w3schools.com/howto/howto_css_login_form.asp, With Some Modifications -->
    <form method="post">
      <fieldset>
        <legend>Survey To Improve User Experience</legend>
        <legend>User Information</legend>
        <div class="username">
          <label for="username"><strong>Username</strong></label>
          <input
            type="text"
            placeholder="Your Full Name"
            name="username"
            required
          />
        </div>
        <div class="gender">
          <label for="gender"><strong>Gender</strong></label>
          <select name="gender" id="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
        <legend>Service Rating</legend>
        <div class="rating">
          <label for="rating"><strong>How would you rate our service?</strong></label>
          <input type="checkbox" name="rating" value="excellent" /> Excellent
          <input type="checkbox" name="rating" value="good" /> Good
          <input type="checkbox" name="rating" value="average" /> Average
          <input type="checkbox" name="rating" value="poor" /> Poor
          </select>
        </div>
        <div class="feedback">
          <label for="feedback"><strong>Additional Feedback</strong></label>
          <textarea name="feedback" placeholder="Your feedback here..." required></textarea>
      </fieldset>
      <input type="submit" value="Login" />
    </form>
    <!-- Summary of Modifications:  
 - Replaceed b tage with semantic strong tag
 - Added fieldset and legend and container divs for better structure and accessibility for each label & input pair
 - Added required attribute to input fields for basic validation
  -->
    <!-- #endregion -->
  </body>
</html>
